name: Committee queue (watchlist, benchmarks, stock alerts)

# Runs every 30 minutes. Each run advances queued committee runs by one step (Saver plan = Anthropic Batch API,
# half price), starts watchlist tickers that are due, checks price alerts once a day, and commits results.
# Stock Alert System (alerts.json): 4:30 am Central sweep, 6:30 am digest issue, free urgent checks in market hours.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Start one ticker now (blank = all due)"
        required: false
      all:
        description: "Start every watchlist ticker, due or not"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: committee-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Advance the queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret yet — nothing to do."; exit 0; fi
          ARGS=""
          if [ -n "${{ inputs.ticker }}" ]; then ARGS="--ticker ${{ inputs.ticker }}"; fi
          if [ "${{ inputs.all }}" = "true" ]; then ARGS="$ARGS --all"; fi
          node runner/run.mjs queue $ARGS
      - name: Update the track record (first days of the month)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ "$(date -u +%d)" -le "02" ] && [ "$(date -u +%H)" = "13" ]; then node runner/run.mjs track; fi
      - name: Commit results
        run: |
          git config user.name "aic-bot"
          git config user.email "aic-bot@users.noreply.github.com"
          git add results evals 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Committee queue $(date -u +%F' '%H:%M)" && git pull --rebase && git push)
